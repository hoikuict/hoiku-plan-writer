{% extends "base.html" %}
{% block title %}ログイン | 保育計画作成支援{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-3xl bg-white p-8 shadow-sm ring-1 ring-stone-200">
  <p class="text-sm font-semibold text-emerald-700">β版</p>
  <h1 class="mt-2 text-3xl font-bold text-stone-900">ログイン</h1>
  <p class="mt-2 text-sm text-stone-500">β版のため、簡易ログインを使用しています。</p>

  <form method="post" action="/staff/login" class="mt-8 grid gap-5">
    <input type="hidden" name="redirect_to" value="{{ redirect_to }}">
    <input type="hidden" name="actor_ref" value="{{ current_user.actor_ref }}">
    <input type="hidden" name="nursery_ref" value="{{ current_user.nursery_ref }}">
    <input type="hidden" name="classroom_refs_raw" value="{{ current_user.classroom_refs | join(',') }}">

    <label class="block text-sm font-medium text-stone-700">
      お名前
      <input type="text" name="name" value="{{ current_user.name }}" placeholder="例：山田 花子" class="mt-2 w-full rounded-xl border border-stone-300 px-3 py-2">
    </label>

    <label class="block text-sm font-medium text-stone-700">
      権限
      <select name="role" class="mt-2 w-full rounded-xl border border-stone-300 px-3 py-2">
        {% for role in available_roles %}
        <option value="{{ role.value }}" {% if current_user.role.value == role.value %}selected{% endif %}>
          {% if role.value == "admin" %}管理者（プロファイル有効化・承認が可能）
          {% elif role.value == "can_edit" %}編集者（計画の作成・編集が可能）
          {% else %}閲覧のみ
          {% endif %}
        </option>
        {% endfor %}
      </select>
      <span class="mt-1 block text-xs text-stone-400">β版：プロファイルの有効化や承認操作には「管理者」が必要です。</span>
    </label>

    <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">ログイン</button>
  </form>
</div>
{% endblock %}
