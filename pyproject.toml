[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoiku-plan-writer"
version = "0.1.0"
description = "保育計画文書作成アプリのMVP土台"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" },
]
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
hoiku-plan = "hoiku_plan_writer.cli:main"
hoiku-plan-server = "hoiku_plan_writer.main:run"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]
