services:
  app:
    build:
      context: .
    container_name: hoiku-plan-writer
    restart: unless-stopped
    environment:
      PORT: 8000
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-1}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-120}
      DEMO_SESSION_INPUT_LIMIT_BYTES: ${DEMO_SESSION_INPUT_LIMIT_BYTES:-65536}
      DEMO_MAX_REQUEST_BODY_BYTES: ${DEMO_MAX_REQUEST_BODY_BYTES:-16384}
      DEMO_SECURE_COOKIES: ${DEMO_SECURE_COOKIES:-1}
      HOIKU_PLAN_AI_PROVIDER: ${HOIKU_PLAN_AI_PROVIDER:-ollama}
      HOIKU_PLAN_AI_ENABLE_ANNUAL_PREVIEW: ${HOIKU_PLAN_AI_ENABLE_ANNUAL_PREVIEW:-1}
      HOIKU_PLAN_AI_ENABLE_MONTHLY_PREVIEW: ${HOIKU_PLAN_AI_ENABLE_MONTHLY_PREVIEW:-1}
      HOIKU_PLAN_AI_MODEL: ${HOIKU_PLAN_AI_MODEL:-qwen2.5:0.5b}
      HOIKU_PLAN_AI_MODEL_OPTIONS: ${HOIKU_PLAN_AI_MODEL_OPTIONS:-qwen2.5:0.5b,qwen2.5:1.5b,qwen2.5:3b,qwen3:8b,gemma4:e4b}
      HOIKU_PLAN_AI_BASE_URL: ${HOIKU_PLAN_AI_BASE_URL:-http://host.docker.internal:11434}
      HOIKU_PLAN_AI_TIMEOUT_SECONDS: ${HOIKU_PLAN_AI_TIMEOUT_SECONDS:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8000}:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hoiku-plan-writer-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
