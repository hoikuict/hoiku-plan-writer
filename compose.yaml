services:
  app:
    build:
      context: .
    container_name: hoiku-plan-writer
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8000}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-1}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-120}
      DEMO_SESSION_INPUT_LIMIT_BYTES: ${DEMO_SESSION_INPUT_LIMIT_BYTES:-65536}
      DEMO_MAX_REQUEST_BODY_BYTES: ${DEMO_MAX_REQUEST_BODY_BYTES:-16384}
      DEMO_SECURE_COOKIES: ${DEMO_SECURE_COOKIES:-1}
      HOIKU_PLAN_AI_PROVIDER: ${HOIKU_PLAN_AI_PROVIDER:-disabled}
      HOIKU_PLAN_AI_ENABLE_ANNUAL_PREVIEW: ${HOIKU_PLAN_AI_ENABLE_ANNUAL_PREVIEW:-0}
      HOIKU_PLAN_AI_MODEL: ${HOIKU_PLAN_AI_MODEL:-qwen2.5:0.5b}
      HOIKU_PLAN_AI_BASE_URL: ${HOIKU_PLAN_AI_BASE_URL:-http://ollama:11434}
      HOIKU_PLAN_AI_TIMEOUT_SECONDS: ${HOIKU_PLAN_AI_TIMEOUT_SECONDS:-180}
    ports:
      - "${PORT:-8000}:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hoiku-plan-writer-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app